# The Android app built from a clean checkout: the codec (Emscripten), naga, the GPU tree, then Gradle's release
# variant. Every run keeps the APK and its licenses as an artifact. On a tag, and where the repository holds the
# signing key (the secret ANDROID_DEBUG_KEYSTORE, base64 of the keystore the release variant signs with), they are
# also attached to that tag's release, made as a draft pre-release where none exists. Without the key the APK is
# signed by a key made on the runner, which does not install over a released build, so nothing is attached.
name: Android app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  EMSDK_VERSION: 6.0.9
  NDK_VERSION: 27.1.12297006

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Emscripten (cached)
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: naga and wgsl2spv (cached)
        uses: actions/cache@v4
        with:
          path: |
            liblizard/.tools
            liblizard/gen/wgsl2spv/target
            ~/.cargo/registry
          key: naga-30.0.1-${{ runner.os }}-${{ hashFiles('liblizard/gen/wgsl2spv/Cargo.lock') }}

      - name: The NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: The codec
        run: |
          source ~/emsdk/emsdk_env.sh
          liblizard/build.sh

      - name: naga
        run: lizard-android/build.sh tools

      - name: The GPU tree
        run: lizard-android/build.sh gen

      - name: The signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi

      - name: The APK
        working-directory: lizard-android
        run: ./gradlew --no-daemon assembleRelease

      - name: The APK and its licenses, named
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' lizard-android/app/build.gradle.kts)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          mkdir -p dist
          cp lizard-android/app/build/outputs/apk/release/app-release.apk "dist/lizard-$v-alpha.apk"
          node lizard-android/licenses.mjs dist/LICENSES.txt

      - uses: actions/upload-artifact@v4
        with:
          name: lizard-android
          path: dist/

      - name: Attached to the release
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --prerelease --title "LIZARD $VERSION (alpha)" --notes ""
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
