<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIZARD</title><meta name="description" content="Move files from a screen to a camera, with no network."><link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="../liblizard/vendor/fonts/inter/InterVariable.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="ui.css">
<style>
  /* ai: Home (2026-10-01): Send and Receive, the received
     files (lizard-web/library.mjs) and Settings. One column, the same at every size. */
  main{max-width:34rem;margin:0 auto;padding:0 16px 2rem}
  .go{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 8px}
  .go .btn{flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:104px;padding:16px;
    border-radius:16px;text-align:center;font-size:18px}
  .go .btn svg{margin-bottom:10px}
</style>
<main>
  <header class="bar"><span class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>LIZARD</span></span><span class="grow"></span></header>
  <div class="go"><a id="send" class="btn" href="send.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Send</a><a id="recv" class="btn" href="recv.html?auto"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Receive</a></div>
  <section id="partial" aria-labelledby="partial-h" hidden><h2 id="partial-h">Unfinished</h2>
    <ul id="partialList" class="list files"></ul>
  </section>
  <section id="files" aria-labelledby="files-h"><h2 id="files-h">Received files</h2>
    <div id="empty" class="empty"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span>This browser keeps no files: a received file stays until its page closes.</span></div>
    <ul id="list" class="list files"></ul>
  </section>
  <section class="settings" aria-labelledby="settings-h">
    <h2 id="settings-h" tabindex="-1">Settings</h2>
    <div class="item"><span class="body"><span class="t">Received files</span><span id="usage" class="s"></span></span><button id="clearAll" class="text danger" type="button" hidden>Delete all</button></div>
    <div class="item"><span class="body"><span class="t">About</span><span id="about" class="s"></span></span></div>
    <a id="source" class="item" href="https://github.com/FNWTalon/LIZARD" target="_blank" rel="noopener"><span class="body"><span class="t">Source code</span></span></a>
  </section>
</main>
<script type="module" src="home.mjs"></script>
